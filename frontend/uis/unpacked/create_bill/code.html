<script>
        function increment(id) {
            const el = document.getElementById(id);
            el.innerText = parseInt(el.innerText) + 1;
            animatePress(el);
        }

        function decrement(id) {
            const el = document.getElementById(id);
            const val = parseInt(el.innerText);
            if (val > 0) {
                el.innerText = val - 1;
                animatePress(el);
            }
        }

        function animatePress(el) {
            el.classList.add('scale-125', 'text-primary', 'transition-all', 'duration-200');
            setTimeout(() => {
                el.classList.remove('scale-125', 'text-primary');
            }, 200);
        }
    </script>
