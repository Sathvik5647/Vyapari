<script>
        // Micro-interaction for Voice Waveform
        const waveform = document.getElementById('waveform');
        const barCount = 18;
        
        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'voice-bar w-1 bg-primary rounded-full';
            bar.style.height = '4px';
            waveform.appendChild(bar);
        }

        const bars = document.querySelectorAll('.voice-bar');
        let isListening = true;

        function animateWaveform() {
            if (!isListening) return;
            bars.forEach((bar, index) => {
                const randomHeight = Math.random() * 32 + 4;
                bar.style.height = `${randomHeight}px`;
            });
            setTimeout(() => requestAnimationFrame(animateWaveform), 100);
        }

        animateWaveform();

        // Toggle Mic interaction
        const micBtn = document.getElementById('mic-btn');
        micBtn.addEventListener('click', () => {
            isListening = !isListening;
            if (isListening) {
                micBtn.classList.remove('bg-on-surface-variant');
                micBtn.classList.add('bg-primary');
                document.getElementById('transcription-hint').innerText = '"Listening..."';
                animateWaveform();
            } else {
                micBtn.classList.remove('bg-primary');
                micBtn.classList.add('bg-on-surface-variant');
                document.getElementById('transcription-hint').innerText = '"Processing speech..."';
                bars.forEach(bar => bar.style.height = '4px');
            }
        });

        // Simulating auto-fill kinetic effect on inputs
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
